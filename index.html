<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Aelion Studio — 浏览器时间线剪辑" />
    <title>Aelion Studio</title>
  </head>
  <body>
    <div class="home" id="home">
      <header class="home-bar">
        <nav class="home-crumbs" aria-label="面包屑">
          <span class="home-brand">Aelion Studio</span>
          <span class="home-sep">/</span>
          <span>全部项目</span>
        </nav>
        <div class="home-views" role="group" aria-label="视图">
          <button
            type="button"
            id="home-view-grid"
            class="icon-btn on"
            data-home-view="grid"
            title="网格"
            aria-label="网格"
          >
            <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                d="M3 3h4.2v4.2H3zm5.8 0H13v4.2H8.8zM3 8.8h4.2V13H3zm5.8 0H13V13H8.8z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="home-view-list"
            class="icon-btn"
            data-home-view="list"
            title="列表"
            aria-label="列表"
          >
            <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                d="M3 4.2h10M3 8h10M3 11.8h10"
              />
            </svg>
          </button>
        </div>
        <label class="home-search">
          <svg class="ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              d="M7 3.2a3.8 3.8 0 1 1 0 7.6 3.8 3.8 0 0 1 0-7.6zM10.2 10.2 13 13"
            />
          </svg>
          <input id="home-search" type="search" placeholder="搜索…" autocomplete="off" />
        </label>
        <button type="button" id="home-new" class="home-new">新建项目</button>
      </header>
      <div class="home-toolbar">
        <span id="home-count">0 个项目</span>
        <label class="home-sort">
          排序
          <select id="home-sort">
            <option value="modified">最近修改</option>
            <option value="title">名称</option>
          </select>
        </label>
      </div>
      <div id="home-grid" class="home-grid"></div>
      <p id="home-status" class="home-status">正在启动…</p>
    </div>

    <div class="studio" id="studio" hidden>
      <header class="menubar">
        <div class="menubar-left">
          <button
            type="button"
            class="icon-btn menubar-back"
            data-cmd="projects"
            title="返回项目"
            aria-label="返回项目"
          >
            <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10 3.4 5.2 8 10 12.6"
              />
            </svg>
          </button>
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="18" height="18">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.1 13 8 3.6 12.9 13"
                />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  d="M5.35 9.2h5.3"
                />
              </svg>
            </span>
            <span class="brand-name">Aelion Studio</span>
          </div>
          <span class="menubar-sep" aria-hidden="true"></span>
          <nav class="menus">
            <details>
              <summary>文件</summary>
              <div class="menu">
                <button type="button" data-cmd="projects">全部项目</button>
                <button type="button" data-cmd="new">新建工程…</button>
                <button type="button" data-cmd="import">导入媒体…</button>
                <button type="button" data-cmd="import-url">从 URL 导入…</button>
                <button type="button" data-cmd="import-opfs">绑定 OPFS</button>
                <button type="button" data-cmd="save">保存草稿</button>
                <button type="button" data-cmd="export-json">导出 Project JSON</button>
              </div>
            </details>
            <details>
              <summary>编辑</summary>
              <div class="menu">
                <button type="button" data-cmd="undo">撤销 <kbd>Ctrl+Z</kbd></button>
                <button type="button" data-cmd="redo">重做 <kbd>Ctrl+Y</kbd></button>
                <button type="button" data-cmd="split">分割 <kbd>S</kbd></button>
                <button type="button" data-cmd="delete">删除 <kbd>Del</kbd></button>
                <button type="button" data-cmd="ripple-delete">波纹删除</button>
              </div>
            </details>
            <details>
              <summary>时间线</summary>
              <div class="menu">
                <button type="button" data-cmd="add-v">添加视频轨</button>
                <button type="button" data-cmd="add-a">添加音频轨</button>
                <button type="button" data-cmd="add-c">添加字幕轨</button>
                <button type="button" data-cmd="marker">在播放头打点 <kbd>M</kbd></button>
              </div>
            </details>
            <details>
              <summary>窗口</summary>
              <div class="menu">
                <button type="button" data-cmd="diagnostics">诊断报告</button>
                <button type="button" data-cmd="capability">能力预检</button>
                <button type="button" data-cmd="shortcuts">快捷键</button>
              </div>
            </details>
          </nav>
        </div>
        <div class="menubar-status" id="project-title">未命名工程</div>
        <div class="menubar-right">
          <button type="button" class="export-launch" data-cmd="export">导出</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel library" id="library"></aside>
        <div class="vsplit" data-split="left"></div>
        <section class="viewer">
          <div class="canvas-shell">
            <canvas id="preview" width="1920" height="1080"></canvas>
            <div id="program-overlay" class="program-overlay" hidden></div>
            <div id="safe-frame" class="safe-frame" hidden></div>
            <div id="monitor-meta" class="monitor-meta">1920×1080 · 30 fps</div>
          </div>
          <div class="monitor-bar">
            <div class="monitor-transport" role="toolbar" aria-label="播放控制">
              <button
                type="button"
                id="to-start"
                class="icon-btn"
                title="到开头"
                aria-label="到开头"
              >
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                  <path fill="currentColor" d="M3 2h2v12H3zm2.6 6L13 3.1v9.8z" />
                </svg>
              </button>
              <button
                type="button"
                id="step-back"
                class="icon-btn"
                title="上一帧"
                aria-label="上一帧"
              >
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                  <path fill="currentColor" d="M11.4 3.1v9.8L4.2 8z" />
                </svg>
              </button>
              <button
                type="button"
                id="play"
                class="play icon-btn"
                title="播放 / 暂停"
                aria-label="播放 / 暂停"
              >
                <svg class="i-play" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                  <path fill="currentColor" d="M4 2.4v11.2L13.2 8z" />
                </svg>
                <svg class="i-pause" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                  <path fill="currentColor" d="M3.6 2.5h3.1v11H3.6zm5.7 0h3.1v11H9.3z" />
                </svg>
              </button>
              <button
                type="button"
                id="step-forward"
                class="icon-btn"
                title="下一帧"
                aria-label="下一帧"
              >
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                  <path fill="currentColor" d="M4.6 3.1v9.8L11.8 8z" />
                </svg>
              </button>
              <button type="button" id="to-end" class="icon-btn" title="到结尾" aria-label="到结尾">
                <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                  <path fill="currentColor" d="M11 2h2v12h-2zM3 3.1v9.8L10.4 8z" />
                </svg>
              </button>
              <div class="monitor-time">
                <span id="timecode" class="timecode">00:00:00:00</span>
                <span class="dim">/</span>
                <span id="duration" class="timecode dim">00:00:00:00</span>
              </div>
            </div>
            <div class="monitor-end">
              <select id="quality" class="monitor-select" aria-label="预览质量" title="预览质量">
                <option value="adaptive">自适应</option>
                <option value="draft">草稿</option>
                <option value="full">全画质</option>
              </select>
              <button
                type="button"
                id="safe-area"
                class="icon-btn"
                data-act="safe-area"
                title="安全框"
                aria-label="安全框"
                aria-pressed="false"
              >
                <svg class="ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M2.8 3.2h10.4v9.6H2.8zM5 5.2h6v5.6H5z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </section>
        <div class="vsplit" data-split="right"></div>
        <aside class="panel inspector">
          <div class="panel-head">检查器</div>
          <div id="inspector"></div>
          <div id="analysis" class="analysis" hidden></div>
        </aside>
        <div class="hsplit" data-split="timeline"></div>
        <section class="timeline-wrap">
          <div class="timeline-tools">
            <div class="tl-tool-group" role="toolbar" aria-label="编辑工具">
              <button
                type="button"
                class="tool on"
                data-tool="select"
                title="选择 V"
                aria-label="选择"
                aria-pressed="true"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M4.2 2.3 12.7 9.2l-3.7.2 2.5 4.8-1.9.9-2.5-4.8-2.5 2.5z"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="tool"
                data-tool="razor"
                title="剃刀 C"
                aria-label="剃刀"
                aria-pressed="false"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M4.2 4.2a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2zm0 4.4a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2zM5.6 6.8 13 3.6M5.6 9.2 13 12.4"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="tool"
                data-tool="slip"
                title="滑移 Y"
                aria-label="滑移"
                aria-pressed="false"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M4.4 4.4h7.2v7.2H4.4zM3 8h10M3 8l1.4-1.4M3 8l1.4 1.4M13 8l-1.4-1.4M13 8l-1.4 1.4"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="tool"
                data-tool="slide"
                title="滑动 U"
                aria-label="滑动"
                aria-pressed="false"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M5.2 4.6h5.6v6.8H5.2zM2.2 8h2.2M11.6 8h2.2M2.2 8l1.3-1.3M2.2 8l1.3 1.3M13.8 8l-1.3-1.3M13.8 8l-1.3 1.3"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="tool"
                data-tool="roll"
                title="滚动 N"
                aria-label="滚动"
                aria-pressed="false"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M2.2 4.4h5.4v7.2H2.2zM8.4 4.4h5.4v7.2H8.4zM5.6 8h4.8M5.6 8l1.2-1.2M5.6 8l1.2 1.2M10.4 8l-1.2-1.2M10.4 8l-1.2 1.2"
                  />
                </svg>
              </button>
            </div>
            <span class="tl-tool-sep"></span>
            <div class="tl-tool-group" role="toolbar" aria-label="编辑模式">
              <button
                type="button"
                id="tl-snap"
                class="on"
                data-act="snap"
                title="吸附（时间线、画面居中与 90° 旋转）"
                aria-label="吸附"
                aria-pressed="true"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M4 3v5.2a4 4 0 0 0 8 0V3M4 3h2.5v5.2a1.5 1.5 0 1 0 3 0V3H12"
                  />
                </svg>
              </button>
              <button
                type="button"
                id="tl-linked"
                class="on"
                data-act="linked"
                title="联动视音频"
                aria-label="联动视音频"
                aria-pressed="true"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    d="M6.4 9.6 9.6 6.4m-4.7 4.7 1.5 1.5a2.2 2.2 0 0 0 3.1 0l1.2-1.2m1.2-4.3-1.5-1.5a2.2 2.2 0 0 0-3.1 0L6.1 6.8"
                  />
                </svg>
              </button>
              <button
                type="button"
                id="tl-ripple"
                data-act="ripple"
                title="波纹编辑"
                aria-label="波纹编辑"
                aria-pressed="false"
              >
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M2.4 4.8h4.6v6.4H2.4zM8.2 8h5.4M11.4 5.8 13.8 8l-2.4 2.2"
                  />
                </svg>
              </button>
            </div>
            <span class="tl-tool-sep"></span>
            <div class="tl-tool-group">
              <button type="button" data-cmd="split" title="分割 S" aria-label="分割">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M4.2 4.2a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2zm0 4.4a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2zM5.6 6.8 13 3.6M5.6 9.2 13 12.4"
                  />
                </svg>
              </button>
              <button type="button" data-act="freeze" title="定格" aria-label="定格">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M8 2.6v10.8M3.8 5.2 12.2 10.8M3.8 10.8 12.2 5.2"
                  />
                </svg>
              </button>
              <button type="button" data-cmd="delete" title="删除 Del" aria-label="删除">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M3.4 4.6h9.2M6 4.6V3.2h4v1.4M4.6 4.6l.6 8.2h5.6l.6-8.2"
                  />
                </svg>
              </button>
              <button type="button" data-cmd="marker" title="打点 M" aria-label="打点">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M4.2 13.2V5.4l3.8-2.6 3.8 2.6v7.8z"
                  />
                </svg>
              </button>
            </div>
            <div class="tl-tool-group tl-push">
              <button type="button" data-act="zoom-out" title="缩小时间线" aria-label="缩小时间线">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="1.4" d="M3.4 8h9.2" />
                </svg>
              </button>
              <button type="button" data-act="zoom-in" title="放大时间线" aria-label="放大时间线">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    d="M8 3.4v9.2M3.4 8h9.2"
                  />
                </svg>
              </button>
            </div>
            <span class="tl-tool-sep"></span>
            <span class="timeline-actions">
              <button type="button" data-cmd="add-v" title="添加视频轨" aria-label="添加视频轨">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M2.4 5.2h4.1l1.1-1.4h3.8v8.6H2.4z"
                  />
                  <circle
                    cx="8"
                    cy="8.4"
                    r="1.8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                  />
                </svg>
              </button>
              <button type="button" data-cmd="add-a" title="添加音频轨" aria-label="添加音频轨">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M3.2 6.2h2.2L8.4 4v8L5.4 9.8H3.2zM10.4 6.4a2.4 2.4 0 0 1 0 3.2"
                  />
                </svg>
              </button>
              <button type="button" data-cmd="add-c" title="添加字幕轨" aria-label="添加字幕轨">
                <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    d="M2.4 3.6h11.2v8.8H2.4z"
                  />
                  <path
                    fill="currentColor"
                    d="M4.2 6.2h2.1v1.2H4.2zm3.4 0h4.2v1.2H7.6zM4.2 8.6h4.4v1.2H4.2zm5.4 0h2.2v1.2H9.6z"
                  />
                </svg>
              </button>
            </span>
          </div>
          <div id="timeline" class="timeline"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="dot" id="status-dot"></span>
        <span id="status">正在启动…</span>
        <span class="grow"></span>
        <span id="backend">—</span>
        <span id="revision">rev —</span>
        <span id="dropped">drop 0</span>
      </footer>
    </div>

    <input id="file-media" type="file" accept="video/*,audio/*,image/*" multiple hidden />
    <input id="file-sub" type="file" accept=".srt,.vtt,text/vtt" hidden />

    <dialog id="dialog-new" class="modal">
      <form method="dialog">
        <h2>新建工程</h2>
        <label>名称<input id="new-title" value="未命名工程" /></label>
        <label
          >预设
          <select id="new-preset">
            <option value="1920x1080x30">1080p 16:9 · 30 fps</option>
            <option value="1920x1080x60">1080p 16:9 · 60 fps</option>
            <option value="1080x1920x30">1080p 9:16 · 30 fps</option>
            <option value="1080x1080x30">1080p 1:1 · 30 fps</option>
            <option value="3840x2160x30">4K 16:9 · 30 fps</option>
          </select>
        </label>
        <menu>
          <button value="cancel">取消</button>
          <button value="ok" class="primary">创建</button>
        </menu>
      </form>
    </dialog>

    <dialog id="dialog-url" class="modal">
      <form method="dialog">
        <h2>从 URL 导入</h2>
        <p>需要支持 HTTP Range 的媒体地址。</p>
        <label>地址<input id="media-url" placeholder="https://" /></label>
        <menu>
          <button value="cancel">取消</button>
          <button value="ok" class="primary">导入</button>
        </menu>
      </form>
    </dialog>

    <dialog id="dialog-export" class="modal export-modal">
      <form method="dialog">
        <header class="modal-head">
          <div>
            <h2>导出</h2>
            <p class="modal-sub">将当前时间线合成为文件</p>
          </div>
          <button type="submit" class="modal-close" value="cancel" aria-label="关闭">
            <svg class="ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8"
              />
            </svg>
          </button>
        </header>
        <div class="modal-body">
          <label class="field">
            <span>封装格式</span>
            <select id="export-profile">
              <optgroup label="视频">
                <option value="mp4-h264-aac">MP4 · H.264 / AAC</option>
                <option value="webm-vp9-opus">WebM · VP9 / Opus</option>
                <option value="mp4-av1-aac">MP4 · AV1 / AAC</option>
                <option value="mp4-hevc-aac">MP4 · HEVC / AAC</option>
              </optgroup>
              <optgroup label="音频">
                <option value="audio-wav">WAV · PCM</option>
              </optgroup>
              <optgroup label="图像">
                <option value="still-png">当前帧 PNG</option>
                <option value="still-jpeg">当前帧 JPEG</option>
                <option value="still-webp">当前帧 WebP</option>
                <option value="animated-gif">GIF</option>
              </optgroup>
            </select>
          </label>
          <div class="field-row" id="export-bitrate-row">
            <label class="field">
              <span>视频码率</span>
              <span class="input-suffix">
                <input id="v-bitrate" type="number" min="100" step="100" value="8000" />
                <span>kbps</span>
              </span>
            </label>
            <label class="field">
              <span>音频码率</span>
              <span class="input-suffix">
                <input id="a-bitrate" type="number" min="32" step="32" value="192" />
                <span>kbps</span>
              </span>
            </label>
          </div>
          <div id="export-status" class="export-status" data-state="idle">
            <span class="export-status-dot" aria-hidden="true"></span>
            <p id="export-preflight" class="preflight">尚未预检</p>
          </div>
          <div id="export-progress-track" class="progress" hidden>
            <span id="export-progress"></span>
          </div>
        </div>
        <menu>
          <button type="button" id="export-preflight-btn">预检</button>
          <span class="grow"></span>
          <button type="button" id="export-cancel" hidden>取消</button>
          <button value="cancel">关闭</button>
          <button type="button" id="export-start" class="primary">开始导出</button>
        </menu>
      </form>
    </dialog>

    <dialog id="dialog-info" class="modal wide">
      <form method="dialog">
        <h2 id="info-title">信息</h2>
        <pre id="info-body"></pre>
        <menu><button value="ok" class="primary">关闭</button></menu>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
